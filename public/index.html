<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocha Gallery Studio</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <p class="eyebrow">Creative Portfolio</p>
      <h1 id="gallery-title">Mocha Gallery Studio</h1>
      <p id="gallery-subtitle">실사용 가능한 반응형 포트폴리오 갤러리</p>
      <div class="hero__actions">
        <input id="search-input" type="search" placeholder="작품 이름/설명 검색" aria-label="검색" />
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="카테고리 필터">
      <button class="chip active" data-category="All">All</button>
    </section>

    <section id="gallery-grid" class="gallery-grid" aria-live="polite"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <img alt="" loading="lazy">
      <div class="card__content">
        <span class="badge"></span>
        <h2></h2>
        <p></p>
      </div>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
